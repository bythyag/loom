[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-agent-runtime"
version = "0.1.0.dev0"
description = "Hardware-aware execution runtime for efficient AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [
  { name = "Thyag Raj" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
