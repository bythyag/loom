[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-agent-runtime"
version = "0.1.0.dev0"
description = "Hardware-aware execution runtime for efficient AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Thyag Raj" }
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "psutil>=6,<8",
  "rich>=13.8,<15",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
]

[project.scripts]
loom = "loom.cli:app"

[project.optional-dependencies]
ollama = [
  "ollama>=0.4,<1",
]
mlx = [
  "mlx-lm>=0.19,<1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
